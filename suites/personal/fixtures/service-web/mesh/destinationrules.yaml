apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: promo-engine
  namespace: promo
spec:
  host: promo-engine.promo.svc.cluster.local
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 50
    outlierDetection:
      consecutive5xxErrors: 20
      interval: 30s
      baseEjectionTime: 30s
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: pricing-api
  namespace: pricing
spec:
  host: pricing-api.pricing.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST
